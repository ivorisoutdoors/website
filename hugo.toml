title = 'Ivor Thibodo'
baseURL = 'https://ivorisoutdoors.com'
languageCode = 'en-us'
copyright = 'Ivor Thibodo'
timeZone = 'America/Chicago'

enableRobotsTXT = true
cleanDestinationDir = true

[params]
description = 'Software Engineer passionate about DevOps and Open Source.'

[params.hero]
id = 'main'
url = 'https://unsplash.com/photos/a-lake-surrounded-by-mountains-and-trees-vNVwg35VZrg'
credit = 'Philipp Düsel'

[frontmatter]
date = [':filename', ':default']

[taxonomies]
category = 'categories'

[permalinks.page]
posts = '/blog/:year/:month/:day/:slug/'
[permalinks.term]
categories = '/blog/category/:slug/'

[outputs]
home = ['html', 'rss', 'json']
section = ['html']
term = ['html']
taxonomy = ['html']

[outputFormats.rss]
baseName = 'feed'
[outputFormats.json]
baseName = 'feed'

[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
